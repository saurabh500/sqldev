[workspace]
resolver = "2"
members = [
    "crates/sqldev-core",
    "crates/sqldev-conn",
    "crates/sqldev-config",
    "crates/sqldev-introspect",
    "crates/sqldev-ddl",
    "crates/sqldev-cli",
]
exclude = [
    # Throwaway M0 spike crates. Self-contained, do not join the workspace
    # so they keep their pinned lockfiles and don't pull in shared deps.
    "spike-introspect",
    "spike-diff",
    "spike-explain",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/saurabhsingh-msft/sqldev"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
mssql-tiberius-bridge = "0.1.0-preview.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

# Internal crate references — referenced via { workspace = true } in member
# Cargo.tomls so version bumps happen in one place.
sqldev-core = { path = "crates/sqldev-core", version = "0.1.0" }
sqldev-conn = { path = "crates/sqldev-conn", version = "0.1.0" }
sqldev-config = { path = "crates/sqldev-config", version = "0.1.0" }
sqldev-introspect = { path = "crates/sqldev-introspect", version = "0.1.0" }
sqldev-ddl = { path = "crates/sqldev-ddl", version = "0.1.0" }

[workspace.lints.clippy]
# Strict-by-default; relax case-by-case in code.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noisy lints we don't want to chase right now.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
