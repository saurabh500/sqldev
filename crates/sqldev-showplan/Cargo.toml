[package]
name = "sqldev-showplan"
version = "0.1.0"
edition = "2021"
description = "Parse SQL Server SHOWPLAN_XML and STATISTICS XML into a typed plan tree"
license = "MIT OR Apache-2.0"
repository = "https://github.com/saurabh500/sqldev"
keywords = ["sql-server", "showplan", "query-plan", "mssql", "explain"]
categories = ["database", "parser-implementations"]
readme = "README.md"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
quick-xml = "0.37"
thiserror = "1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
