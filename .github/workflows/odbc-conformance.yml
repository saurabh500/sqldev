name: ODBC conformance

on:
  push:
    branches: [main, odbc-conformance]
  pull_request:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      upstream_main:
        description: Audit upstream main, including quarantined Rust cases
        type: boolean
        default: false

concurrency:
  group: odbc-conformance-${{ github.ref }}-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.upstream_main)) && 'audit' || 'pinned' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ODBC_DRIVER: ODBC Driver 18 for SQL Server
  ODBC_SERVER: 127.0.0.1,1433
  ODBC_USER: sa
  ODBC_PASSWORD: "Conformance!Pass2026"
  ODBC_DATABASE: tempdb
  UPSTREAM_AUDIT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.upstream_main) }}

jobs:
  conformance:
    name: unixODBC + Microsoft ODBC Driver 18
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      audit_report: ${{ steps.comparison-summary.outputs.audit_report }}

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Conformance!Pass2026"
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - name: Install unixODBC and Microsoft ODBC Driver 18
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo /tmp/packages-microsoft-prod.deb \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y \
            msodbcsql18 unixodbc unixodbc-dev cmake ninja-build g++ libgtest-dev \
            libssl-dev pkg-config
          odbcinst -j
          odbcinst -q -d -n "${ODBC_DRIVER}"

      - name: Select Rust driver source
        id: rust-source
        run: |
          python3 - <<'PY'
          import json, os
          with open("odbc-conformance/driver-source.json") as f:
              source = json.load(f)
          revision = "main" if os.environ["UPSTREAM_AUDIT"] == "true" else source["revision"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"revision={revision}", file=f)
              print(f"toolchain={source['rust_toolchain']}", file=f)
          PY

      - uses: actions/checkout@v4
        with:
          repository: microsoft/mssql-rs
          ref: ${{ steps.rust-source.outputs.revision }}
          path: build/external/mssql-rs
          persist-credentials: false

      - name: Record resolved Rust revision
        env:
          REQUESTED_REF: ${{ steps.rust-source.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          source = json.loads(Path("odbc-conformance/driver-source.json").read_text())
          source["ref"] = os.environ["REQUESTED_REF"]
          source["revision"] = subprocess.check_output(
              ["git", "-C", "build/external/mssql-rs", "rev-parse", "HEAD"],
              text=True).strip()
          Path("build/driver-source.json").write_text(json.dumps(source, indent=2) + "\n")
          print(f"Testing mssql-rs {source['ref']} at {source['revision']}")
          PY

      - name: Build mssql-rs ODBC driver
        working-directory: build/external/mssql-rs
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-source.outputs.toolchain }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo build -p mssqlodbc --release
          bash mssql-odbc/scripts/finalize-artifact.sh release

      - name: Configure and build
        run: |
          cmake -S odbc-conformance -B build/odbc-conformance \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/odbc-conformance
          python3 -m unittest discover -s odbc-conformance -p 'test_*.py'

      - name: Wait for SQL Server through ODBC
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if build/odbc-conformance/odbc-conformance \
                --gtest_filter=OdbcConformance.Connection \
                > /tmp/odbc-readiness.log 2>&1; then
              cat /tmp/odbc-readiness.log
              exit 0
            fi
            sleep 2
          done
          cat /tmp/odbc-readiness.log
          echo "SQL Server did not become ready through ODBC" >&2
          exit 1

      - name: Compare both ODBC drivers
        run: |
          args=()
          if [ "$UPSTREAM_AUDIT" = "true" ]; then
            args+=(--audit-known-failures)
          fi
          python3 odbc-conformance/compare.py \
            --build-dir build/odbc-conformance \
            --rust-driver build/external/mssql-rs/target/release/mssqlodbc.so \
            --source-metadata build/driver-source.json \
            --output-dir build/comparison "${args[@]}"

      - name: Publish side-by-side summary
        id: comparison-summary
        if: always()
        run: |
          if [ -f build/comparison/summary.md ]; then
            cat build/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$UPSTREAM_AUDIT" = "true" ] && [ -f build/comparison/comparison.json ]; then
            echo "audit_report=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload GoogleTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odbc-conformance-comparison
          path: |
            build/comparison/
            build/external/mssql-rs/Cargo.lock
          if-no-files-found: warn

      - name: Dump SQL Server logs on failure
        if: failure()
        run: docker logs "${{ job.services.sqlserver.id }}" --tail 200

  report-recoveries:
    name: Report upstream-main recoveries
    needs: conformance
    if: >-
      ${{ always() && needs.conformance.outputs.audit_report == 'true' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.upstream_main)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: odbc-upstream-recovery-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: odbc-conformance-comparison
          path: build/audit-report

      - name: File or update recovery issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 odbc-conformance/report_recoveries.py \
            --report build/audit-report/comparison/comparison.json \
            --run-url "$RUN_URL"
